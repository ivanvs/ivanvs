name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *" # daily, regenerates the cards
  workflow_dispatch: # lets you trigger the first run manually

permissions:
  contents: write # the action commits the generated SVGs back to the repo

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the commit SHA of v0.12.1 — a tag can be moved, a SHA cannot.
      # v0.7.0 lost the profile-details and stats cards when GitHub stopped serving
      # `stargazers` to GITHUB_TOKEN (upstream #311, fixed in #313).
      - uses: vn7n24fzkq/github-profile-summary-cards@58ec032e39377dd38329bdc1db70074fe74fbb17 # v0.12.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: ${{ github.repository_owner }}
